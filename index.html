<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stop the Watch — Timing Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #050a0b;
    --window: #14201f;
    --window-2: #0c1516;
    --panel: rgba(255,255,255,0.035);
    --panel-edge: rgba(255,255,255,0.08);
    --divider: rgba(255,255,255,0.07);
    --teal: #4da5aa;
    --teal-bright: #7fe4da;
    --teal-deep: #0a2a2c;
    --glow: #edfffd;
    --amber: #f0b429;
    --red: #ff6b6b;
    --text: #eef8f7;
    --text-dim: #93b0b1;
    --text-faint: #52716f;
    font-size: 16px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 24px;
    background:
      radial-gradient(ellipse 900px 600px at 50% -8%, #142c2c 0%, var(--bg-0) 60%);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    cursor: default;
    user-select: none;
  }

  /* ---------- macOS window chrome ---------- */
  .window {
    width: 720px;
    max-width: 100%;
    background: linear-gradient(180deg, var(--window) 0%, var(--window-2) 100%);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    box-shadow:
      0 60px 120px -40px rgba(0,0,0,0.8),
      0 0 0 1px rgba(0,0,0,0.4),
      0 1px 0 rgba(255,255,255,0.06) inset;
    overflow: hidden;
  }

  .titlebar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    height: 40px;
    padding: 0 14px;
    background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.0));
    border-bottom: 1px solid var(--divider);
  }
  .traffic-lights { display: flex; gap: 8px; }
  .traffic-lights span {
    width: 12px; height: 12px; border-radius: 50%;
    display: inline-block;
    box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.15);
  }
  .tl-close  { background: #ff5f57; }
  .tl-min    { background: #febc2e; }
  .tl-zoom   { background: #28c840; }
  .titlebar-title {
    text-align: center;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.01em;
  }

  .body-grid {
    display: grid;
    grid-template-columns: 1fr 224px;
  }

  /* ---------- main panel ---------- */
  .main-panel {
    padding: 30px 34px 32px;
    border-right: 1px solid var(--divider);
  }

  .brand-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .brand-mark {
    width: 26px;
    height: auto;
    filter: drop-shadow(0 0 6px rgba(77,165,170,0.5));
  }

  .eyebrow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 3px;
  }
  .eyebrow .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-faint);
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  .eyebrow.live .dot {
    background: var(--teal-bright);
    box-shadow: 0 0 8px rgba(127,228,218,0.6);
  }

  h1 {
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    margin: 2px 0 20px;
    letter-spacing: 0.005em;
  }

  .target-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 22px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .target-row label { font-weight: 500; }
  .target-field {
    display: flex;
    align-items: center;
    background: #071112;
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    overflow: hidden;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .target-field:hover { border-color: rgba(255,255,255,0.16); }
  .target-field input {
    width: 52px;
    background: transparent;
    border: none;
    color: var(--teal-bright);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    text-align: right;
    padding: 6px 4px 6px 10px;
    cursor: text;
  }
  .target-field input:focus { outline: none; }
  .target-field span {
    padding-right: 10px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
  }
  .target-field:focus-within {
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(77,165,170,0.18);
  }
  .stepper {
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--panel-edge);
  }
  .stepper button {
    background: transparent;
    border: none;
    color: var(--text-dim);
    width: 20px;
    height: 12.5px;
    font-size: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .stepper button:hover { background: rgba(255,255,255,0.06); color: var(--teal-bright); }
  .stepper button:active { background: rgba(255,255,255,0.1); }
  .target-row.locked { opacity: 0.4; pointer-events: none; }

  /* ---------- dial ---------- */
  .dial-wrap {
    position: relative;
    width: 250px;
    height: 250px;
    margin: 0 auto 22px;
  }
  svg.dial { width: 100%; height: 100%; overflow: visible; }

  .tick { stroke: var(--text-faint); stroke-width: 1; }
  .tick.major { stroke: var(--text-dim); stroke-width: 1.6; }
  .scale-label {
    fill: var(--text-faint);
    font-family: 'JetBrains Mono', monospace;
    font-size: 8.5px;
    text-anchor: middle;
    dominant-baseline: middle;
  }
  .dial-ring { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 1; }

  .target-mark { transition: transform 0.3s ease; }
  .target-mark path {
    fill: var(--teal-bright);
    filter: drop-shadow(0 0 5px rgba(127,228,218,0.6));
  }

  .accuracy-arc {
    fill: none;
    stroke-width: 4;
    stroke-linecap: round;
    stroke-dasharray: 500;
    stroke-dashoffset: 500;
    transition: stroke-dashoffset 0.7s cubic-bezier(.2,.8,.2,1), stroke 0.3s ease;
  }
  .accuracy-arc.show { stroke-dashoffset: 0; }

  .actual-mark circle { transition: opacity 0.25s ease; opacity: 0; }
  .actual-mark.show circle { opacity: 1; }

  .center-readout {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .center-logo {
    position: absolute;
    width: 78px;
    height: auto;
    opacity: 0.5;
    filter: drop-shadow(0 0 10px rgba(77,165,170,0.35));
    transition: opacity 0.4s ease, filter 0.4s ease, transform 0.4s ease;
  }
  .center-logo.pulse { animation: breathe 2.6s ease-in-out infinite; }
  .center-logo.dim { opacity: 0.12; transform: scale(0.9); }
  @keyframes breathe {
    0%, 100% { opacity: 0.45; filter: drop-shadow(0 0 8px rgba(127,228,218,0.35)); transform: scale(0.97); }
    50% { opacity: 0.85; filter: drop-shadow(0 0 20px rgba(127,228,218,0.65)); transform: scale(1.04); }
  }

  .state-label {
    font-size: 10.5px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--text-faint);
    z-index: 1;
  }
  .readout-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 33px;
    font-weight: 700;
    color: var(--teal-bright);
    text-shadow: 0 0 18px rgba(127,228,218,0.35);
    z-index: 1;
    opacity: 0;
    transform: translateY(4px) scale(0.96);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .readout-time.show { opacity: 1; transform: translateY(0) scale(1); }

  /* ---------- controls ---------- */
  .control-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .pusher {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    font-size: 12.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #04191a;
    background: radial-gradient(circle at 35% 30%, #a6f1e8, var(--teal) 60%, #256267 100%);
    box-shadow:
      0 7px 0 var(--teal-deep),
      0 14px 26px rgba(77,165,170,0.28),
      inset 0 2px 3px rgba(255,255,255,0.5);
    transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
  }
  .pusher:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .pusher:active,
  .pusher.pressed {
    transform: translateY(6px);
    box-shadow:
      0 1px 0 var(--teal-deep),
      0 6px 14px rgba(77,165,170,0.2),
      inset 0 2px 3px rgba(255,255,255,0.4);
  }
  .pusher:focus-visible { outline: 2px solid var(--teal-bright); outline-offset: 4px; }
  .pusher.running {
    background: radial-gradient(circle at 35% 30%, #ff9c8c, var(--red) 60%, #b8362f 100%);
    box-shadow:
      0 7px 0 #7c221d,
      0 14px 26px rgba(255,107,107,0.25),
      inset 0 2px 3px rgba(255,255,255,0.4);
  }
  .pusher.running:active,
  .pusher.running.pressed {
    box-shadow:
      0 1px 0 #7c221d,
      0 6px 14px rgba(255,107,107,0.2),
      inset 0 2px 3px rgba(255,255,255,0.3);
  }

  .kbd-hint {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-faint);
  }
  kbd {
    font-family: -apple-system, sans-serif;
    font-size: 10.5px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 5px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-bottom-width: 2px;
    color: var(--text-dim);
  }

  .verdict {
    min-height: 20px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    opacity: 0;
    transition: opacity 0.3s ease 0.15s;
  }
  .verdict.show { opacity: 1; }
  .verdict .diff-tag {
    font-family: 'JetBrains Mono', monospace;
    margin-left: 6px;
    padding: 2px 7px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
  }
  .tag-good { color: var(--teal-bright); background: rgba(127,228,218,0.12); }
  .tag-mid  { color: var(--amber); background: rgba(240,180,41,0.12); }
  .tag-bad  { color: var(--red); background: rgba(255,107,107,0.12); }

  /* ---------- sidebar ---------- */
  .sidebar {
    background: rgba(0,0,0,0.15);
    padding: 26px 20px;
    display: flex;
    flex-direction: column;
  }
  .sidebar-title {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 14px;
  }
  .stat-block {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-bottom: 18px;
  }
  .stat-label {
    font-size: 11px;
    color: var(--text-faint);
  }
  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }
  .stat-value.accent { color: var(--teal-bright); }

  .divider-line {
    height: 1px;
    background: var(--divider);
    margin: 4px 0 16px;
  }

  .history-title {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 10px;
  }
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    overflow-y: auto;
    max-height: 200px;
    padding-right: 2px;
  }
  .history-list::-webkit-scrollbar { width: 4px; }
  .history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }

  .history-empty {
    font-size: 11.5px;
    color: var(--text-faint);
    line-height: 1.5;
  }

  .history-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    padding: 6px 8px;
    border-radius: 7px;
    background: rgba(255,255,255,0.025);
    animation: rowIn 0.3s ease;
  }
  @keyframes rowIn {
    from { opacity: 0; transform: translateX(6px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .history-row .h-time {
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-dim);
  }
  .history-row .h-diff {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 11px;
  }

  .reset-btn {
    margin-top: 16px;
    padding: 8px 0;
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .reset-btn:hover {
    background: rgba(255,107,107,0.1);
    border-color: rgba(255,107,107,0.3);
    color: var(--red);
  }
  .reset-btn:active { transform: translateY(1px); }
  .reset-btn:focus-visible { outline: 2px solid var(--teal-bright); outline-offset: 2px; }

  .hint {
    text-align: center;
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 16px;
    line-height: 1.5;
  }

  @media (max-width: 680px) {
    .body-grid { grid-template-columns: 1fr; }
    .main-panel { border-right: none; border-bottom: 1px solid var(--divider); }
    .sidebar { flex-direction: row; flex-wrap: wrap; gap: 20px 28px; }
    .history-list { max-height: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .center-logo.pulse { animation: none; opacity: 0.6; }
    .accuracy-arc, .readout-time, .verdict, .pusher, .history-row { transition: none; animation: none; }
  }
</style>
</head>

          <div class="state-label" id="stateLabel">Press to start</div>
          <div class="readout-time" id="readoutTime">0.00</div>
        </div>
      </div>

      <div class="control-row">
        <button class="pusher" id="pusher" aria-label="Start timer">Start</button>
        <div class="kbd-hint"><kbd>Space</kbd><span>to start / stop</span></div>
        <div class="verdict" id="verdict"></div>
      </div>

      <p class="hint">No numbers while it runs — go by feel, then stop the instant you think you've hit your target.</p>
    </div>

    <div class="sidebar">
      <div class="sidebar-title">Session</div>

      <div class="stat-block">
        <div class="stat-label">Attempts</div>
        <div class="stat-value" id="statAttempts">0</div>
      </div>
      <div class="stat-block">
        <div class="stat-label">Best margin</div>
        <div class="stat-value accent" id="statBest">—</div>
      </div>
      <div class="stat-block">
        <div class="stat-label">Avg. margin</div>
        <div class="stat-value" id="statAvg">—</div>
      </div>

      <div class="divider-line"></div>

      <div class="history-title">Recent</div>
      <div class="history-list" id="historyList">
        <div class="history-empty" id="historyEmpty">Your last few tries will show up here.</div>
      </div>

      <button class="reset-btn" id="resetBtn" type="button">Reset session</button>
    </div>
  </div>
</div>

<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const cx = 100, cy = 100;

  const targetInput   = document.getElementById('targetInput');
  const targetRow      = document.getElementById('targetRow');
  const stepUp         = document.getElementById('stepUp');
  const stepDown       = document.getElementById('stepDown');
  const pusher         = document.getElementById('pusher');
  const stateLabel     = document.getElementById('stateLabel');
  const readoutTime    = document.getElementById('readoutTime');
  const centerLogo     = document.getElementById('centerLogo');
  const verdict        = document.getElementById('verdict');
  const eyebrow        = document.getElementById('eyebrow');
  const eyebrowText    = document.getElementById('eyebrowText');
  const ticksGroup     = document.getElementById('ticks');
  const targetMarkG    = document.getElementById('targetMark');
  const actualMarkG    = document.getElementById('actualMark');
  const accuracyArc    = document.getElementById('accuracyArc');
  const statAttempts   = document.getElementById('statAttempts');
  const statBest       = document.getElementById('statBest');
  const statAvg        = document.getElementById('statAvg');
  const historyList    = document.getElementById('historyList');
  const historyEmpty   = document.getElementById('historyEmpty');
  const resetBtn       = document.getElementById('resetBtn');

  let state = 'ready'; // ready | running | stopped
  let startTime = null;
  let target = 3;
  let scale = 10;
  let attempts = [];

  function polar(rad, angleDeg) {
    const a = (angleDeg - 90) * Math.PI / 180;
    return { x: cx + rad * Math.cos(a), y: cy + rad * Math.sin(a) };
  }
  function angleFor(seconds) { return ((seconds % scale) / scale) * 360; }

  function pickScale(t, elapsed) {
    const upper = Math.max(t, elapsed || 0) * 1.4;
    let s = Math.ceil(upper / 5) * 5;
    if (s < 10) s = 10;
    return s;
  }

  function drawTicks() {
    ticksGroup.innerHTML = '';
    for (let i = 0; i < 60; i++) {
      const angle = (i / 60) * 360;
      const major = i % 5 === 0;
      const r1 = 90, r2 = major ? 82 : 86;
      const p1 = polar(r1, angle);
      const p2 = polar(r2, angle);
      const line = document.createElementNS(NS, 'line');
      line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
      line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
      line.setAttribute('class', 'tick' + (major ? ' major' : ''));
      ticksGroup.appendChild(line);
    }
    [0, 0.25, 0.5, 0.75].forEach(f => {
      const val = Math.round(scale * f * 10) / 10;
      const p = polar(70, f * 360);
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', p.x); t.setAttribute('y', p.y);
      t.setAttribute('class', 'scale-label');
      t.textContent = val;
      ticksGroup.appendChild(t);
    });
  }

  function diamondPath(px, py, angleDeg, size) {
    const a = angleDeg * Math.PI / 180;
    const cos = Math.cos(a), sin = Math.sin(a);
    const pts = [[0, -size], [size * 0.6, 0], [0, size], [-size * 0.6, 0]];
    const rotated = pts.map(([x, y]) => {
      const rx = x * cos - y * sin;
      const ry = x * sin + y * cos;
      return `${px + rx},${py + ry}`;
    });
    return `M${rotated.join(' L')} Z`;
  }

  function drawTargetMark() {
    const angle = angleFor(target);
    const p = polar(90, angle);
    targetMarkG.innerHTML = `<path d="${diamondPath(p.x, p.y, angle, 6)}"></path>`;
  }

  function accuracyColor(diff) {
    if (diff <= 0.15) return 'var(--teal-bright)';
    if (diff <= 0.4) return 'var(--amber)';
    return 'var(--red)';
  }

  function drawAccuracyArc(elapsed) {
    const tAngle = angleFor(target);
    const eAngle = angleFor(elapsed);
    const r = 90;
    let delta = eAngle - tAngle;
    if (Math.abs(delta) > 180) delta = delta - Math.sign(delta) * 360;
    const start = tAngle;
    const end = tAngle + delta;
    const large = Math.abs(delta) > 180 ? 1 : 0;
    const sweep = delta > 0 ? 1 : 0;
    const p1 = polar(r, start);
    const p2 = polar(r, end);
    accuracyArc.setAttribute('d', `M${p1.x},${p1.y} A${r},${r} 0 ${large} ${sweep} ${p2.x},${p2.y}`);
    accuracyArc.style.stroke = accuracyColor(Math.abs(elapsed - target));
  }

  function drawActualMark(elapsed) {
    const angle = angleFor(elapsed);
    const p = polar(90, angle);
    const color = accuracyColor(Math.abs(elapsed - target));
    actualMarkG.innerHTML = `<circle cx="${p.x}" cy="${p.y}" r="5" fill="${color}" style="filter: drop-shadow(0 0 6px ${color})"></circle>`;
  }

  function resetDialState() {
    accuracyArc.classList.remove('show');
    accuracyArc.setAttribute('d', '');
    actualMarkG.classList.remove('show');
    actualMarkG.innerHTML = '';
    readoutTime.classList.remove('show');
    verdict.classList.remove('show');
    verdict.innerHTML = '';
    centerLogo.classList.remove('dim');
  }

  function syncTarget() {
    let v = parseFloat(targetInput.value);
    if (isNaN(v)) v = 3;
    v = Math.min(30, Math.max(0.5, v));
    targetInput.value = v;
    target = v;
    scale = pickScale(target);
    drawTicks();
    drawTargetMark();
  }

  targetInput.addEventListener('input', () => { if (state === 'ready') syncTarget(); });
  stepUp.addEventListener('click', () => {
    if (state !== 'ready') return;
    targetInput.value = (parseFloat(targetInput.value) || 3) + 0.5;
    syncTarget();
  });
  stepDown.addEventListener('click', () => {
    if (state !== 'ready') return;
    targetInput.value = (parseFloat(targetInput.value) || 3) - 0.5;
    syncTarget();
  });

  function updateSidebar() {
    statAttempts.textContent = attempts.length;
    if (attempts.length === 0) {
      statBest.textContent = '—';
      statAvg.textContent = '—';
      historyEmpty.style.display = 'block';
      return;
    }
    historyEmpty.style.display = 'none';
    const diffs = attempts.map(a => a.diff);
    const best = Math.min(...diffs);
    const avg = diffs.reduce((a, b) => a + b, 0) / diffs.length;
    statBest.textContent = '±' + best.toFixed(2) + 's';
    statAvg.textContent = '±' + avg.toFixed(2) + 's';
  }

  function addHistoryRow(elapsed, diff) {
    const row = document.createElement('div');
    row.className = 'history-row';
    const color = accuracyColor(diff);
    row.innerHTML = `<span class="h-time">${elapsed.toFixed(2)}s</span><span class="h-diff" style="color:${color}">±${diff.toFixed(2)}s</span>`;
    historyList.prepend(row);
    const rows = historyList.querySelectorAll('.history-row');
    if (rows.length > 6) rows[rows.length - 1].remove();
  }

  function startGame() {
    state = 'running';
    resetDialState();
    targetRow.classList.add('locked');
    pusher.textContent = 'Stop';
    pusher.classList.add('running');
    pusher.setAttribute('aria-label', 'Stop timer');
    stateLabel.textContent = 'Running — go by feel';
    centerLogo.classList.add('pulse');
    eyebrow.classList.add('live');
    eyebrowText.textContent = 'Timing';
    startTime = performance.now();
  }

  function stopGame() {
    const elapsed = (performance.now() - startTime) / 1000;
    state = 'stopped';

    centerLogo.classList.remove('pulse');
    centerLogo.classList.add('dim');
    eyebrow.classList.remove('live');
    eyebrowText.textContent = 'Result';
    pusher.textContent = 'Try Again';
    pusher.classList.remove('running');
    pusher.setAttribute('aria-label', 'Play again');
    targetRow.classList.remove('locked');
    stateLabel.textContent = 'You stopped at';

    const newScale = pickScale(target, elapsed);
    if (newScale !== scale) {
      scale = newScale;
      drawTicks();
      drawTargetMark();
    }

    readoutTime.textContent = elapsed.toFixed(2);
    requestAnimationFrame(() => readoutTime.classList.add('show'));

    drawAccuracyArc(elapsed);
    drawActualMark(elapsed);
    requestAnimationFrame(() => {
      accuracyArc.classList.add('show');
      actualMarkG.classList.add('show');
    });

    const diff = Math.abs(elapsed - target);
    let tag = 'tag-bad', msg = 'Keep practicing';
    if (diff <= 0.05) { tag = 'tag-good'; msg = 'Uncanny'; }
    else if (diff <= 0.15) { tag = 'tag-good'; msg = 'Great feel'; }
    else if (diff <= 0.4) { tag = 'tag-mid'; msg = 'Close'; }
    verdict.innerHTML = `${msg}<span class="diff-tag ${tag}">±${diff.toFixed(2)}s</span>`;
    requestAnimationFrame(() => verdict.classList.add('show'));

    attempts.push({ elapsed, diff });
    addHistoryRow(elapsed, diff);
    updateSidebar();

    state = 'ready';
  }

  function handlePress() {
    if (state === 'ready' && pusher.textContent === 'Start') {
      startGame();
    } else if (pusher.classList.contains('running')) {
      stopGame();
    } else {
      pusher.textContent = 'Start';
      pusher.setAttribute('aria-label', 'Start timer');
      stateLabel.textContent = 'Press to start';
      startGame();
    }
  }

  function resetSession() {
    // cancel an in-progress run cleanly, without recording it
    state = 'ready';
    startTime = null;
    resetDialState();
    targetRow.classList.remove('locked');
    pusher.textContent = 'Start';
    pusher.classList.remove('running');
    pusher.setAttribute('aria-label', 'Start timer');
    stateLabel.textContent = 'Press to start';
    centerLogo.classList.remove('pulse');
    eyebrow.classList.remove('live');
    eyebrowText.textContent = 'Ready';

    attempts = [];
    historyList.querySelectorAll('.history-row').forEach(row => row.remove());
    historyEmpty.style.display = 'block';
    updateSidebar();
  }

  resetBtn.addEventListener('click', resetSession);

  pusher.addEventListener('click', handlePress);

  pusher.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter') pusher.classList.add('pressed');
  });
  pusher.addEventListener('keyup', () => pusher.classList.remove('pressed'));

  // laptop-first: global spacebar shortcut, like a native mac utility
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
      e.preventDefault();
      pusher.classList.add('pressed');
      handlePress();
    }
  });
  document.addEventListener('keyup', e => {
    if (e.code === 'Space') pusher.classList.remove('pressed');
  });

  syncTarget();
})();
</script>

</body>
</html>
